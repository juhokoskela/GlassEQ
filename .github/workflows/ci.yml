name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-26

    steps:
      - name: Check out
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Check release DSP performance
        run: swift run -c release GlassEQDiagnostics dsp-benchmark --check

      - name: Build release app bundle
        run: ./Scripts/build-release-app.sh

      - name: Verify signatures
        run: |
          codesign --verify --strict --verbose=2 .build/release-app/GlassEQ.app/Contents/Helpers/GlassEQSettings.app
          codesign --verify --strict --verbose=2 .build/release-app/GlassEQ.app
